<nav class="barra-superior" [class.modo-apresentacao]="navegacaoLivre">
  <div class="barra-superior-esquerda">
    <button
      type="button"
      class="botao-perfil"
      (click)="abrirPerfil.emit($event)"
      aria-label="Abrir menu do perfil"
    >
      <img src="/assets/img/user.png" alt="Perfil" />
    </button>

    <div class="marca">Alquimia | Marcha Analítica</div>
    <span class="selo-apresentacao" *ngIf="navegacaoLivre">Apresentação</span>
  </div>

  <!-- bloco dos botoes das etapas -->
  <div class="nav-etapas" *ngIf="etapas.length">
    <button
      type="button"
      class="botao-etapa"
      *ngFor="let etapa of etapas; trackBy: trackByEtapa"
      [class.ativo]="etapaCorrente === etapa.id"
      [class.concluida]="etapa.concluida"
      [class.bloqueada]="etapa.bloqueada && !navegacaoLivre"
      [disabled]="etapa.bloqueada && !navegacaoLivre"
      (click)="clicarEtapa(etapa)"
    >
      {{ etapa.label | textoVisivel }}
    </button>
  </div>
</nav>
