<nav class="topbar" [class.modo-apresentacao]="navegacaoLivre">
  <div class="topbar-left">
    <button
      type="button"
      class="profile-button"
      (click)="abrirPerfil.emit($event)"
      aria-label="Abrir menu do perfil"
    >
      <img src="/assets/img/user.png" alt="Perfil" />
    </button>

    <div class="brand">Alquimia | Marcha Analítica</div>
    <span class="badge-apresentacao" *ngIf="navegacaoLivre">Apresentação</span>
  </div>

  <!-- bloco dos botoes das etapas -->
  <div class="stage-nav" *ngIf="etapas.length">
    <button
      type="button"
      class="stage-btn"
      *ngFor="let etapa of etapas; trackBy: trackByEtapa"
      [class.active]="etapaCorrente === etapa.id"
      [class.completed]="etapa.concluida"
      [class.locked]="etapa.bloqueada && !navegacaoLivre"
      [disabled]="etapa.bloqueada && !navegacaoLivre"
      (click)="clicarEtapa(etapa)"
    >
      {{ etapa.label | textoVisivel }}
    </button>
  </div>
</nav>
