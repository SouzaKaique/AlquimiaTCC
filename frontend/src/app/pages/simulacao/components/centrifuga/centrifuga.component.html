<div class="sobreposicao-equipamento" *ngIf="equipamento">
  <div class="janela-equipamento">
    <div class="cabecalho-janela-equipamento">
      <div>
        <div class="titulo-janela-equipamento">{{ titulo | textoVisivel }}</div>
        <div class="texto-janela-equipamento">{{ instrucao | textoVisivel }}</div>
      </div>

      <button type="button" class="fechar-janela-equipamento" aria-label="Fechar simulador" (click)="fechar.emit()">
        ×
      </button>
    </div>

    <div class="area-trabalho-equipamento" [class.tubo-carregado]="tuboNoEquipamento">
      <div class="origem-equipamento" *ngIf="!tuboNoEquipamento">
        <div
          class="tubo-origem-equipamento"
          draggable="true"
          (dragstart)="iniciarArrasteTubo.emit($event)"
        >
          <img src="/assets/img/tubo.png" alt="Tubo para equipamento" />
        </div>
        <span>Arraste o tubo para dentro do equipamento.</span>
      </div>

      <div
        class="area-soltar-equipamento"
        [class.com-tubo]="tuboNoEquipamento"
        [class.processando]="processamento"
        (dragover)="permitirSoltar.emit($event)"
        (drop)="soltarTubo.emit($event)"
      >
        <div class="maquina-equipamento" [class.maquina-centrifuga]="equipamento === equipamentoSimulacao.Centrifuga">
          <div class="nucleo-maquina"></div>
          <div class="encaixe-maquina">
            <img
              *ngIf="tuboNoEquipamento"
              class="tubo-no-equipamento"
              src="/assets/img/tubo.png"
              alt="Tubo dentro do equipamento"
            />
            <span *ngIf="!tuboNoEquipamento">Solte o tubo aqui</span>
          </div>
        </div>
      </div>
    </div>

    <div class="acoes-equipamento">
      <div class="status-equipamento">{{ status | textoVisivel }}</div>
      <button
        type="button"
        class="botao-acao"
        [disabled]="!tuboNoEquipamento || processamento"
        (click)="iniciarProcesso.emit()"
      >
        {{ botao | textoVisivel }}
      </button>
    </div>
  </div>
</div>
