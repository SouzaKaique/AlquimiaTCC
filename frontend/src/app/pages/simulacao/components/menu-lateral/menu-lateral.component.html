<div class="fundo-menu-lateral" [class.aberto]="aberto" (click)="fechar.emit()"></div>

<aside class="menu-perfil" [class.aberto]="aberto">
  <div class="cabecalho-menu-perfil">
    <div class="avatar-perfil">
      <img src="/assets/img/user.png" alt="Usuário" />
    </div>
    <div class="nome-perfil">{{ usuarioNome }}</div>
  </div>

  <div class="corpo-menu-perfil">
    <a
      class="item-menu"
      routerLink="/simulacao"
      routerLinkActive="ativo"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="fechar.emit()"
    >
      <span class="icone-menu">
        <span class="icone-pixel-menu">L</span>
      </span>
      <span class="rotulo-menu">Laboratório</span>
      <span class="seta-menu">></span>
    </a>

    <a class="item-menu" routerLink="/quiz" routerLinkActive="ativo" (click)="fechar.emit()">
      <span class="icone-menu">
        <span class="icone-pixel-menu">Q</span>
      </span>
      <span class="rotulo-menu">Quiz</span>
      <span class="seta-menu">></span>
    </a>

    <a class="item-menu" routerLink="/relatorio" routerLinkActive="ativo" (click)="fechar.emit()">
      <span class="icone-menu">
        <span class="icone-pixel-menu">R</span>
      </span>
      <span class="rotulo-menu">Relatório</span>
      <span class="seta-menu">></span>
    </a>

    <button type="button" class="item-menu item-menu-perigo" (click)="sair.emit()">
      <span class="icone-menu">
        <img src="/assets/img/icon-sair.png" alt="Sair" />
      </span>
      <span class="rotulo-menu">Sair</span>
      <span class="seta-menu">></span>
    </button>
  </div>
</aside>
