<div class="status-box">
  <div class="status-title">Observação atual</div>
  <div class="status-main" [attr.data-message]="mensagem">{{ mensagem | textoVisivel }}</div>
  <div class="status-sub">
    Etapa: {{ etapaLabel | textoVisivel }}
    <span *ngIf="testeChama?.ativa"> | {{ testeChama?.mensagem | textoVisivel }}</span>
  </div>
</div>
