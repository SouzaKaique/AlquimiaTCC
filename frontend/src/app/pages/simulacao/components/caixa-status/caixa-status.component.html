<div class="caixa-status">
  <div class="titulo-status">Observação atual</div>
  <div class="status-principal" [attr.data-message]="mensagem">{{ mensagem | textoVisivel }}</div>
  <div class="status-secundario">
    Etapa: {{ etapaLabel | textoVisivel }}
    <span *ngIf="testeChama?.ativa"> | {{ testeChama?.mensagem | textoVisivel }}</span>
  </div>
</div>
