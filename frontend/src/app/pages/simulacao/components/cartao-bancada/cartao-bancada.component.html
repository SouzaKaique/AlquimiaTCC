<div
  class="cartao-bancada"
  [class.cartao-bancada-principal]="variante === 'main'"
  [class.cartao-bancada-lateral]="variante === 'side' || variante === 'side-bottom'"
  [class.inferior]="variante === 'side-bottom'"
>
  <div class="titulo-bancada">{{ card.titulo | textoVisivel }}</div>
  <div class="texto-bancada">{{ card.conteudo | textoVisivel }}</div>
</div>
