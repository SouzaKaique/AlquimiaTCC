<div
  class="tubo-ensaio"
  [class.tubo-destacado]="hoverTubo"
  [class.tubo-pronto]="!!reagenteSelecionado"
  [class.tubo-aquecendo]="hoverChama"
  [ngStyle]="tuboEstilo"
  (dragover)="tuboDragOver.emit($event)"
  (dragleave)="tuboDragLeave.emit()"
  (drop)="tuboDrop.emit($event)"
  (mousedown)="tuboPointerDown.emit($event)"
>
  <div class="janela-liquido-tubo">
    <div
      class="liquido-tubo"
      [style.height.%]="visual.nivel"
      [style.background]="visual.gradiente"
      [class.turvo]="visual.turva"
    >
      <div class="bolhas-tubo" *ngIf="mostrarBolhas">
        <span
          *ngFor="let bubble of bolhasDecorativas; trackBy: trackByDecorativo"
          class="bolha bolha-{{ bubble }}"
        ></span>
      </div>
      <div
        class="precipitado"
        *ngIf="visual.precipitado_ativo"
        [style.background]="visual.precipitado_cor"
      ></div>
    </div>
    <div class="superficie-liquido" [style.bottom.%]="visual.nivel"></div>
  </div>

  <div class="fumaca-tubo" *ngIf="mostrarFumaca">
    <span
      *ngFor="let smoke of fumacaDecorativa; trackBy: trackByDecorativo"
      class="fumaca fumaca-{{ smoke }}"
    ></span>
  </div>
  <div class="aura-tubo" *ngIf="mostrarAura"></div>
  <img class="vidro-tubo" src="/assets/img/tubo.png" alt="Tubo de ensaio" />
  <div class="area-soltar-tubo">
    {{ dicaTubo }}
  </div>
</div>
