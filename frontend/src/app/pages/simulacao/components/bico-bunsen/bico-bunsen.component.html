<div
  class="area-bico"
  [class.chama-ativa]="chamaAtiva"
  [style.--flame-color]="corChama"
>
  <div class="alvo-chama" [class.ativo]="hoverChama || testeChama?.ativa"></div>
  <button class="bico" type="button" (click)="alternarChama.emit()">
    <div class="visual-bico" [class.chama-teste]="testeChama?.ativa">
      <img
        class="imagem-bico"
        src="/assets/img/bico-off.png"
        alt="Bico de Bunsen"
      />
      <div class="chama-bico" *ngIf="chamaAtiva" aria-hidden="true">
        <span class="chama-brilho"></span>
        <span class="chama-externa"></span>
        <span class="chama-interna"></span>
        <span class="chama-nucleo"></span>
      </div>
    </div>
  </button>
  <span class="legenda-bico">
    {{ mensagem | textoVisivel }}
  </span>
</div>
